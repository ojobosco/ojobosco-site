<script>
(function(){
"use strict";

if(
  location.pathname.startsWith("/config") ||
  location.hostname.includes("account.squarespace.com")
){
  return;
}

const C={
  backend:"https://squarespace-mercadopago.onrender.com",
  cart:"ojobosco-carrinho-v2",
  ship:"ojobosco-frete-v1",
  ga:"ojobosco-pedido-pendente-ga4",
  coupon:"BEMVINDO",
  discount:10,
  freeCoupon:"CAMILAGUS",
  products:{}
};

let freteAtual=null;
let regiaoAtual="";
let produtoConfigurado=false;
let viewRegistrada=false;
let checkoutRegistrado=false;
let cupomAplicado=false;
let cupomFreteGratis=false;

const $=id=>document.getElementById(id);

const num=v=>
  String(v||"").replace(/\D/g,"");

const norm=v=>
  String(v||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim()
    .replace(/\s+/g," ")
    .toUpperCase();

function moeda(v){
  v=Number(v);

  return Number.isFinite(v)
    ? v.toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
      })
    : "R$ 0,00";
}

function cepFmt(v){
  v=num(v).slice(0,8);

  return v.length>5
    ? v.slice(0,5)+"-"+v.slice(5)
    : v;
}

function telFmt(v){
  v=num(v);

  if(
    v.startsWith("55") &&
    v.length>11
  ){
    v=v.slice(2);
  }

  v=v.slice(0,11);

  if(v.length<=2){
    return v;
  }

  if(v.length<=6){
    return `(${v.slice(0,2)}) ${v.slice(2)}`;
  }

  if(v.length<=10){
    return `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`;
  }

  return `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
}

function ga(nome,p={}){
  if(typeof window.gtag==="function"){
    window.gtag("event",nome,p);
  }else{
    window.dataLayer=
      window.dataLayer||[];

    window.dataLayer.push({
      event:nome,
      ...p
    });
  }
}

function itemGA(i){
  return{
    item_id:String(
      i.produtoId||
      i.chave||
      ""
    ),
    item_name:String(
      i.nome||
      "Produto OJOBOSCO"
    ),
    item_variant:String(
      i.tamanho||
      ""
    ),
    price:Number(
      i.preco||
      0
    ),
    quantity:Number(
      i.quantidade||
      1
    )
  };
}

function lerCarrinho(){
  try{
    const d=
      JSON.parse(
        localStorage.getItem(C.cart)||
        "[]"
      );

    return Array.isArray(d)
      ? d
      : [];
  }catch{
    return [];
  }
}

function salvarCarrinho(c){
  localStorage.setItem(
    C.cart,
    JSON.stringify(c)
  );

  atualizarCarrinho();
}

function qtdTotal(){
  return lerCarrinho()
    .reduce(
      (t,i)=>
        t+
        Number(i.quantidade||0),
      0
    );
}

function subtotal(){
  return lerCarrinho()
    .reduce(
      (t,i)=>
        t+
        Number(i.preco||0)*
        Number(i.quantidade||0),
      0
    );
}

function desconto(){
  return cupomAplicado
    ? Number(
        (
          subtotal()*
          C.discount/
          100
        ).toFixed(2)
      )
    : 0;
}

function produtosComDesconto(){
  return Math.max(
    0,
    subtotal()-desconto()
  );
}

function freteEfetivo(){
  if(freteAtual===null){
    return null;
  }

  if(
    cupomFreteGratis ||
    produtosComDesconto()>=500
  ){
    return 0;
  }

  return Number(freteAtual);
}

function prazo(reg){
  const t=norm(reg);

  return(
    t.includes("RECIFE") ||
    t.includes("REGIAO METROPOLITANA") ||
    t.includes("METROPOLITANA")
  )
    ? 2
    : 10;
}

function textoFrete(f,r){
  return(
    `Frete: ${moeda(f)}`+
    `${r?" — "+r:""}`+
    `\nPrazo de entrega: até ${prazo(r)} dias úteis.`
  );
}

function guardarFrete(d){
  try{
    localStorage.setItem(
      C.ship,
      JSON.stringify(d)
    );
  }catch{}
}

function lerFrete(){
  try{
    return JSON.parse(
      localStorage.getItem(C.ship)||
      "null"
    );
  }catch{
    return null;
  }
}

function valor(id){
  return String(
    $(id)?.value||
    ""
  ).trim();
}

function setValor(id,v){
  if($(id)){
    $(id).value=v||"";
  }
}

function msg(texto,tipo){
  const e=$("ojb-mensagem");

  if(!e){
    return;
  }

  e.textContent=texto;

  e.className=
    `ojb-msg ${
      tipo==="sucesso"
        ?"ojb-sucesso"
        :"ojb-erro"
    }`;
}

function limparMsg(){
  const e=$("ojb-mensagem");

  if(e){
    e.textContent="";
    e.className="ojb-msg";
  }
}

function restaurarFrete(){
  const d=lerFrete();

  if(
    !d ||
    !d.cep ||
    !Number.isFinite(
      Number(d.frete)
    )
  ){
    return;
  }

  setValor(
    "ojb-cep",
    cepFmt(d.cep)
  );

  setValor(
    "ojb-rua",
    d.rua
  );

  setValor(
    "ojb-bairro",
    d.bairro
  );

  setValor(
    "ojb-cidade",
    d.cidade
  );

  setValor(
    "ojb-estado",
    d.estado
  );

  freteAtual=
    Number(d.frete);

  regiaoAtual=
    d.regiao||"";

  atualizarResumo();
}

function precoVisivel(){
  for(
    const s of [
      ".ProductItem-details-price",
      ".product-price",
      ".sqs-money-native",
      "[data-test='product-price']",
      ".product-price-value",
      ".price"
    ]
  ){
    for(
      const e of
      document.querySelectorAll(s)
    ){
      const st=
        getComputedStyle(e);

      if(
        st.display==="none" ||
        st.visibility==="hidden"
      ){
        continue;
      }

      const m=
        String(
          e.textContent||
          ""
        ).match(
          /R\$\s*([\d.]+(?:,\d{2})?)/
        );

      if(m){
        const n=
          Number(
            m[1]
              .replace(/\./g,"")
              .replace(",",".")
          );

        if(
          Number.isFinite(n) &&
          n>0
        ){
          return n;
        }
      }
    }
  }

  return 0;
}

function nomeProduto(){
  for(
    const s of [
      ".ProductItem-details-title",
      ".product-title",
      "[data-test='product-title']",
      "main h1",
      "h1"
    ]
  ){
    const e=
      document.querySelector(s);

    const t=
      String(
        e?.textContent||
        ""
      ).trim();

    if(t){
      return t;
    }
  }

  return(
    document.title
      .split("|")[0]
      .trim() ||
    "Produto OJOBOSCO"
  );
}

function imagemProduto(){
  for(
    const s of [
      ".ProductItem-gallery img",
      ".product-gallery img",
      "[data-test='product-image'] img",
      ".ProductItem img",
      "main img"
    ]
  ){
    const e=
      document.querySelector(s);

    const u=
      e?.currentSrc||
      e?.src||
      e?.getAttribute(
        "data-src"
      );

    if(u){
      return u;
    }
  }

  return "";
}

function quantidadeProduto(){
  for(
    const s of [
      "input[name='quantity']",
      ".product-quantity-input input",
      ".ProductItem-details input[type='number']",
      "input[type='number']"
    ]
  ){
    const e=
      document.querySelector(s);

    if(
      e &&
      !e.closest(
        "#ojb-carrinho"
      )
    ){
      const q=
        Number(e.value);

      if(
        Number.isInteger(q) &&
        q>0
      ){
        return q;
      }
    }
  }

  return 1;
}

function opcaoProduto(){
  for(
    const s of
    document.querySelectorAll(
      "select"
    )
  ){
    if(
      s.closest(
        "#ojb-carrinho"
      )
    ){
      continue;
    }

    const nome=
      norm(
        s.name||
        s.id||
        s.getAttribute(
          "aria-label"
        )||
        ""
      );

    const o=
      s.options[
        s.selectedIndex
      ];

    const t=
      String(
        o?.textContent||
        o?.value||
        ""
      ).trim();

    const eh=
      nome.includes("TAMANHO") ||
      nome.includes("SIZE") ||
      nome.includes("FRAGRANCIA") ||
      nome.includes("AROMA") ||
      nome.includes("COR") ||
      /\b\d+\s*(ML|G|KG|L)\b/i.test(t);

    if(eh){
      if(
        !t ||
        norm(t).includes(
          "SELECIONE"
        )
      ){
        return "";
      }

      return t;
    }
  }

  for(
    const r of
    document.querySelectorAll(
      "input[type='radio']:checked"
    )
  ){
    if(
      r.closest(
        "#ojb-carrinho"
      )
    ){
      continue;
    }

    const l=
      r.id
        ? document.querySelector(
            `label[for="${CSS.escape(r.id)}"]`
          )
        : null;

    const t=
      String(
        l?.textContent||
        r.value||
        ""
      ).trim();

    if(t){
      return t;
    }
  }

  return "";
}

function varianteId(){
  for(
    const e of
    document.querySelectorAll(
      "[data-variant-id],[data-selected-variant-id],option:checked"
    )
  ){
    if(
      e.closest(
        "#ojb-carrinho"
      )
    ){
      continue;
    }

    const v=
      e.getAttribute(
        "data-variant-id"
      )||
      e.getAttribute(
        "data-selected-variant-id"
      )||
      e.value;

    if(
      v &&
      /^[a-f0-9]{20,40}$/i.test(
        String(v)
      )
    ){
      return String(v);
    }
  }

  return "";
}

function produtoId(){
  const path=
    location.pathname
      .replace(/\/+$/,"");

  if(C.products[path]){
    return C.products[path];
  }

  for(
    const a of [
      "data-item-id",
      "data-product-id",
      "data-itemid",
      "data-productid"
    ]
  ){
    for(
      const e of
      document.querySelectorAll(
        `[${a}]`
      )
    ){
      const v=
        e.getAttribute(a);

      if(
        v &&
        /^[a-f0-9]{20,40}$/i.test(v)
      ){
        return v;
      }
    }
  }

  for(
    const s of [
      "meta[itemprop='productID']",
      "meta[property='product:retailer_item_id']",
      "meta[name='product-id']"
    ]
  ){
    const v=
      document
        .querySelector(s)
        ?.getAttribute(
          "content"
        );

    if(
      v &&
      /^[a-f0-9]{20,40}$/i.test(v)
    ){
      return v;
    }
  }

  for(
    const sc of
    document.querySelectorAll(
      "script:not([src])"
    )
  ){
    const t=
      String(
        sc.textContent||
        ""
      );

    for(
      const p of [
        /"productId"\s*:\s*"([a-f0-9]{20,40})"/i,
        /"product_id"\s*:\s*"([a-f0-9]{20,40})"/i,
        /"itemId"\s*:\s*"([a-f0-9]{20,40})"/i
      ]
    ){
      const m=
        t.match(p);

      if(m?.[1]){
        return m[1];
      }
    }
  }

  return "";
}

function botaoNativo(){
  for(
    const s of [
      ".sqs-add-to-cart-button",
      "[data-test='add-to-cart-button']",
      ".ProductItem-details .sqs-block-button-element",
      "button[type='submit']"
    ]
  ){
    for(
      const e of
      document.querySelectorAll(s)
    ){
      if(
        e.closest(
          "#ojb-carrinho"
        )
      ){
        continue;
      }

      const t=
        norm(
          e.textContent||
          e.value||
          e.getAttribute(
            "aria-label"
          )
        );

      if(
        t.includes(
          "ADICIONAR"
        )||
        t.includes(
          "CARRINHO"
        )||
        t.includes(
          "ADD TO CART"
        )
      ){
        return e;
      }
    }
  }

  return null;
}

function avisoProduto(t,tipo){
  const e=
    $("ojb-aviso-produto");

  if(e){
    e.textContent=t;

    e.className=
      tipo==="sucesso"
        ?"ojb-sucesso"
        :"ojb-erro";
  }
}

function adicionarProduto(){
  const b=
    $("ojb-adicionar-carrinho");

  try{
    b.disabled=true;
    b.textContent=
      "Adicionando...";

    const p=
      produtoId();

    const tam=
      opcaoProduto();

    const vid=
      varianteId();

    const q=
      quantidadeProduto();

    const nome=
      nomeProduto();

    const preco=
      precoVisivel();

    const img=
      imagemProduto();

    if(!p){
      throw new Error(
        "Não foi possível identificar este produto."
      );
    }

    if(!tam){
      throw new Error(
        "Selecione uma opção do produto."
      );
    }

    const c=
      lerCarrinho();

    const ch=
      p+
      "::"+
      (
        vid||
        norm(tam)
      );

    const ex=
      c.find(
        i=>
          i.chave===ch
      );

    if(ex){
      ex.quantidade+=q;
      ex.nome=nome;
      ex.preco=preco;
      ex.imagem=img;
    }else{
      c.push({
        chave:ch,
        produtoId:p,
        varianteId:vid,
        tamanho:tam,
        quantidade:q,
        nome,
        preco,
        imagem:img
      });
    }

    salvarCarrinho(c);

    ga(
      "add_to_cart",
      {
        currency:"BRL",
        value:
          Number(preco||0)*
          q,
        items:[
          itemGA({
            produtoId:p,
            nome,
            tamanho:tam,
            preco,
            quantidade:q
          })
        ]
      }
    );

    avisoProduto(
      "Produto adicionado ao carrinho.",
      "sucesso"
    );

    abrirCarrinho();

  }catch(e){

    avisoProduto(
      e.message||
      "Não foi possível adicionar o produto.",
      "erro"
    );

  }finally{

    if(b){
      b.disabled=false;
      b.textContent=
        "Adicionar ao carrinho";
    }
  }
}

async function calcularFreteProduto(){
  const c=
    $("ojb-cep-produto");

  const b=
    $("ojb-calcular-frete-produto");

  const r=
    $("ojb-resultado-frete-produto");

  const cep=
    num(
      c?.value
    );

  if(
    !c ||
    !b ||
    !r
  ){
    return;
  }

  if(cep.length!==8){
    r.textContent=
      "Informe um CEP válido com 8 números.";

    r.className=
      "ojb-erro";

    return;
  }

  b.disabled=true;
  b.textContent=
    "Calculando...";

  try{
    const res=
      await fetch(
        `${C.backend}/calcular-frete?cep=${encodeURIComponent(cep)}`,
        {
          headers:{
            Accept:
              "application/json"
          }
        }
      );

    const d=
      await res.json();

    if(!res.ok){
      throw new Error(
        d.erro||
        "Não foi possível consultar esse CEP."
      );
    }

    const f=
      Number(
        d.frete
      );

    if(
      !Number.isFinite(f)
    ){
      throw new Error(
        "O valor do frete não foi retornado."
      );
    }

    freteAtual=f;
    regiaoAtual=
      d.regiao||"";

    c.value=
      cepFmt(
        d.cep||cep
      );

    guardarFrete({
      cep:
        d.cep||cep,
      rua:
        d.rua||"",
      bairro:
        d.bairro||"",
      cidade:
        d.cidade||"",
      estado:
        d.estado||"",
      frete:f,
      regiao:
        regiaoAtual
    });

    r.textContent=
      textoFrete(
        f,
        regiaoAtual
      );

    r.className=
      "ojb-sucesso";

    restaurarFrete();

  }catch(e){

    r.textContent=
      e.message||
      "Não foi possível calcular o frete.";

    r.className=
      "ojb-erro";

  }finally{

    b.disabled=false;
    b.textContent=
      "Calcular frete";
  }
}

function configurarProduto(){
  if(produtoConfigurado){
    return true;
  }

  const n=
    botaoNativo();

  if(!n){
    return false;
  }

  document
    .querySelectorAll(
      "#ojb-adicionar-carrinho,#ojb-aviso-produto,#ojb-calculadora-frete-produto"
    )
    .forEach(
      e=>e.remove()
    );

  const wrap=
    n.closest(
      ".sqs-add-to-cart-button-wrapper"
    )||
    n.parentElement;

  if(!wrap){
    return false;
  }

  const b=
    document.createElement(
      "button"
    );

  b.id=
    "ojb-adicionar-carrinho";

  b.type=
    "button";

  b.textContent=
    "Adicionar ao carrinho";

  const a=
    document.createElement(
      "div"
    );

  a.id=
    "ojb-aviso-produto";

  a.setAttribute(
    "aria-live",
    "polite"
  );

  const f=
    document.createElement(
      "div"
    );

  f.id=
    "ojb-calculadora-frete-produto";

  f.innerHTML=`
    <div class="ojb-frete-linha">
      <input
        id="ojb-cep-produto"
        type="text"
        inputmode="numeric"
        autocomplete="postal-code"
        maxlength="9"
        placeholder="Digite seu CEP"
      >
      <button
        id="ojb-calcular-frete-produto"
        type="button"
      >
        Calcular frete
      </button>
    </div>

    <div
      id="ojb-resultado-frete-produto"
      aria-live="polite"
    ></div>
  `;

  wrap.insertAdjacentElement(
    "beforebegin",
    b
  );

  b.insertAdjacentElement(
    "afterend",
    a
  );

  a.insertAdjacentElement(
    "afterend",
    f
  );

  wrap.style.display=
    "none";

  b.addEventListener(
    "click",
    adicionarProduto
  );

  $("ojb-calcular-frete-produto")
    .addEventListener(
      "click",
      calcularFreteProduto
    );

  $("ojb-cep-produto")
    .addEventListener(
      "input",
      function(){
        this.value=
          cepFmt(
            this.value
          );
      }
    );

  $("ojb-cep-produto")
    .addEventListener(
      "keydown",
      e=>{
        if(
          e.key===
          "Enter"
        ){
          e.preventDefault();
          calcularFreteProduto();
        }
      }
    );

  const d=
    lerFrete();

  if(d?.cep){
    $("ojb-cep-produto").value=
      cepFmt(
        d.cep
      );

    $("ojb-resultado-frete-produto").textContent=
      textoFrete(
        d.frete,
        d.regiao||""
      );

    $("ojb-resultado-frete-produto").className=
      "ojb-sucesso";
  }

  if(!viewRegistrada){
    ga(
      "view_item",
      {
        currency:"BRL",
        value:
          precoVisivel(),
        items:[
          itemGA({
            produtoId:
              produtoId(),
            nome:
              nomeProduto(),
            tamanho:
              opcaoProduto(),
            preco:
              precoVisivel(),
            quantidade:
              1
          })
        ]
      }
    );

    viewRegistrada=
      true;
  }

  produtoConfigurado=
    true;

  return true;
}

function alterarQtd(i,d){
  const c=
    lerCarrinho();

  if(!c[i]){
    return;
  }

  c[i].quantidade+=d;

  if(
    c[i].quantidade<=0
  ){
    c.splice(
      i,
      1
    );
  }

  freteAtual=null;
  regiaoAtual="";

  salvarCarrinho(c);
}

function remover(i){
  const c=
    lerCarrinho();

  c.splice(
    i,
    1
  );

  freteAtual=null;
  regiaoAtual="";

  salvarCarrinho(c);
}

              }

              ${

function aplicarCupom(){
  const campo=
    $("ojb-cupom");

  const m=
    $("ojb-cupom-mensagem");

  const cod=
    norm(
      campo?.value
    );

  if(
    !campo ||
    !m
  ){
    return;
  }

  if(
    cod===C.coupon
  ){
    cupomAplicado=true;
    cupomFreteGratis=false;

    campo.value=
      C.coupon;

    m.textContent=
      `Desconto de ${C.discount}% aplicado.`;

    m.className=
      "ojb-inline-msg ojb-sucesso";

  }else if(
    cod===C.freeCoupon
  ){
    cupomAplicado=false;
    cupomFreteGratis=true;

    campo.value=
      C.freeCoupon;

    m.textContent=
      "Frete grátis aplicado.";

    m.className=
      "ojb-inline-msg ojb-sucesso";

  }else{
    cupomAplicado=false;
    cupomFreteGratis=false;

    m.textContent=
      cod
        ? "Código de desconto inválido."
        : "Digite o código de desconto.";

    m.className=
      "ojb-inline-msg ojb-erro";
  }

  atualizarResumo();
}

function atualizarResumo(){
  const sub=
    subtotal();

  const desc=
    desconto();

  const fre=
    freteEfetivo();

  if(
    $("ojb-checkout-subtotal")
  ){
    $("ojb-checkout-subtotal").textContent=
      sub>0
        ? moeda(sub)
        : "Confirmado no pagamento";
  }

  if(
    $("ojb-linha-desconto")
  ){
    $("ojb-linha-desconto").style.display=
      cupomAplicado
        ? "flex"
        : "none";
  }

  if(
    $("ojb-checkout-desconto")
  ){
    $("ojb-checkout-desconto").textContent=
      "-"+
      moeda(desc);
  }

  if(
    $("ojb-checkout-frete")
  ){
    $("ojb-checkout-frete").textContent=
      fre===null
        ? "Informe o CEP"
        : fre===0
          ? "Frete grátis"
          : moeda(fre);
  }

  if(
    $("ojb-checkout-total")
  ){
    $("ojb-checkout-total").textContent=
      sub>0 &&
      fre!==null
        ? moeda(
            sub-
            desc+
            Number(fre)
          )
        : "—";
  }

  if(
    $("ojb-regiao")
  ){
    $("ojb-regiao").textContent=
      regiaoAtual
        ? `Entrega: ${regiaoAtual}${fre===0?" • Frete grátis":""} • Prazo: até ${prazo(regiaoAtual)} dias úteis`
        : "";
  }
}

async function buscarCep(){
  limparMsg();

  const cep=
    num(
      valor(
        "ojb-cep"
      )
    );

  if(
    cep.length!==8
  ){
    msg(
      "Informe um CEP válido com 8 números.",
      "erro"
    );

    return;
  }

  const b=
    $("ojb-buscar-cep");

  b.disabled=true;
  b.textContent=
    "Buscando...";

  try{
    const res=
      await fetch(
        `${C.backend}/calcular-frete?cep=${encodeURIComponent(cep)}`,
        {
          headers:{
            Accept:
              "application/json"
          }
        }
      );

    const d=
      await res.json();

    if(!res.ok){
      throw new Error(
        d.erro||
        "Não foi possível consultar esse CEP."
      );
    }

    freteAtual=
      Number(
        d.frete
      );

    regiaoAtual=
      d.regiao||"";

    setValor(
      "ojb-cep",
      cepFmt(
        d.cep||cep
      )
    );

    setValor(
      "ojb-rua",
      d.rua
    );

    setValor(
      "ojb-bairro",
      d.bairro
    );

    setValor(
      "ojb-cidade",
      d.cidade
    );

    setValor(
      "ojb-estado",
      d.estado
    );

    guardarFrete({
      cep:
        d.cep||cep,
      rua:
        d.rua||"",
      bairro:
        d.bairro||"",
      cidade:
        d.cidade||"",
      estado:
        d.estado||"",
      frete:
        freteAtual,
      regiao:
        regiaoAtual
    });

    atualizarResumo();

    ga(
      "add_shipping_info",
      {
        currency:"BRL",
        value:
          produtosComDesconto()+
          Number(
            freteEfetivo()||
            0
          ),
        shipping_tier:
          freteEfetivo()===0
            ? `Frete grátis | ${regiaoAtual||"Frete por CEP"}`
            : `${regiaoAtual||"Frete por CEP"} | até ${prazo(regiaoAtual)} dias úteis`,
        items:
          lerCarrinho()
            .map(itemGA)
      }
    );

    msg(
      freteEfetivo()===0
        ? "Endereço encontrado. Seu pedido ganhou frete grátis."
        : "Endereço encontrado e frete calculado.",
      "sucesso"
    );

    $("ojb-numero")
      ?.focus();

  }catch(e){

    freteAtual=null;
    regiaoAtual="";

    setValor(
      "ojb-rua",
      ""
    );

    setValor(
      "ojb-bairro",
      ""
    );

    setValor(
      "ojb-cidade",
      ""
    );

    setValor(
      "ojb-estado",
      ""
    );

    atualizarResumo();

    msg(
      e.message||
      "Não foi possível consultar o CEP.",
      "erro"
    );

  }finally{

    b.disabled=false;
    b.textContent=
      "Buscar endereço";
  }
}

function validar(){
  const d={
    nomeCompleto:
      valor(
        "ojb-nome"
      ),
    email:
      valor(
        "ojb-email"
      ),
    telefone:
      valor(
        "ojb-telefone"
      ),
    cep:
      num(
        valor(
          "ojb-cep"
        )
      ),
    rua:
      valor(
        "ojb-rua"
      ),
    numero:
      valor(
        "ojb-numero"
      ),
    complemento:
      valor(
        "ojb-complemento"
      ),
    bairro:
      valor(
        "ojb-bairro"
      ),
    cidade:
      valor(
        "ojb-cidade"
      ),
    estado:
      valor(
        "ojb-estado"
      )
  };

  if(
    d.nomeCompleto
      .split(/\s+/)
      .filter(Boolean)
      .length<2
  ){
    throw new Error(
      "Informe seu nome completo."
    );
  }

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
      d.email
    )
  ){
    throw new Error(
      "Informe um e-mail válido."
    );
  }

  let t=
    num(
      d.telefone
    );

  if(
    t.startsWith("55") &&
    t.length>11
  ){
    t=
      t.slice(2);
  }

  if(
    t.length!==10 &&
    t.length!==11
  ){
    throw new Error(
      "Informe um telefone válido com DDD."
    );
  }

  if(
    d.cep.length!==8
  ){
    throw new Error(
      "Informe um CEP válido."
    );
  }

  if(
    freteAtual===null
  ){
    throw new Error(
      "Clique em “Buscar endereço” para calcular o frete."
    );
  }

  if(!d.rua){
    throw new Error(
      "Informe a rua ou avenida."
    );
  }

  if(!d.numero){
    throw new Error(
      "Informe o número do endereço."
    );
  }

  if(!d.bairro){
    throw new Error(
      "Informe o bairro."
    );
  }

  if(
    !d.cidade ||
    !d.estado
  ){
    throw new Error(
      "Consulte novamente o CEP."
    );
  }

  return d;
}

async function criarCheckout(){
  limparMsg();

  const b=
    $("ojb-pagar");

  try{
    const carrinho=
      lerCarrinho();

    if(
      !carrinho.length
    ){
      throw new Error(
        "O carrinho está vazio."
      );
    }

    const cli=
      validar();

    const itens=
      carrinho.map(
        i=>({
          produtoId:
            i.produtoId,
          varianteId:
            i.varianteId||"",
          tamanho:
            i.tamanho,
          quantidade:
            i.quantidade
        })
      );

    const fre=
      freteEfetivo();

    const total=
      subtotal()-
      desconto()+
      Number(
        fre||
        0
      );

    const gaItens=
      carrinho.map(
        itemGA
      );

    b.disabled=true;

    b.textContent=
      "Preparando pagamento...";

    ga(
      "add_payment_info",
      {
        currency:
          "BRL",
        value:
          total,
        payment_type:
          "Mercado Pago",
        items:
          gaItens
      }
    );

    try{
      localStorage.setItem(
        C.ga,
        JSON.stringify({
          valor:
            total,
          frete:
            Number(
              fre||
              0
            ),
          itens:
            gaItens,
          criadoEm:
            new Date()
              .toISOString()
        })
      );
    }catch{}

    const res=
      await fetch(
        C.backend+
        "/criar-checkout",
        {
          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json",
            Accept:
              "application/json"
          },

          body:
            JSON.stringify({
              itens,

              codigoDesconto:
                cupomAplicado
                  ? C.coupon
                  : "",

              nomeCompleto:
                cli.nomeCompleto,

              email:
                cli.email,

              telefone:
                cli.telefone,

              cep:
                cli.cep,

              rua:
                cli.rua,

              numero:
                cli.numero,

              complemento:
                cli.complemento,

              bairro:
                cli.bairro,

              cidade:
                cli.cidade,

              estado:
                cli.estado
            })
        }
      );

    let d;

    try{
      d=
        await res.json();
    }catch{
      throw new Error(
        "O servidor retornou uma resposta inválida."
      );
    }

    if(!res.ok){
      throw new Error(
        d.erro||
        d.detalhes||
        "Não foi possível criar o pagamento."
      );
    }

    if(
      !d.checkout_url
    ){
      throw new Error(
        "O endereço do pagamento não foi retornado."
      );
    }

    localStorage.removeItem(
      C.cart
    );

    location.href=
      d.checkout_url;

  }catch(e){

    localStorage.removeItem(
      C.ga
    );

    ga(
      "checkout_error",
      {
        error_message:
          String(
            e.message||
            ""
          )
      }
    );

    msg(
      e.message||
      "Não foi possível continuar para o pagamento.",
      "erro"
    );

    b.disabled=false;

    b.textContent=
      "Pagar com Mercado Pago";
  }
}

function retornoPagamento(){
  const p=
    new URLSearchParams(
      location.search
    );

  const status=
    String(
      p.get("status")||
      ""
    ).toLowerCase();

  const id=
    p.get("payment_id")||
    p.get("collection_id")||
    p.get("merchant_order_id")||
    "";

  if(!status){
    return;
  }

  let ped=null;

  try{
    ped=
      JSON.parse(
        localStorage.getItem(C.ga)||
        "null"
      );
  }catch{}

  if(
    status==="approved" &&
    ped &&
    id
  ){
    const k=
      "ojobosco-compra-ga4-"+
      id;

    if(
      !localStorage.getItem(k)
    ){
      ga(
        "purchase",
        {
          transaction_id:
            String(id),
          affiliation:
            "OJOBOSCO - Mercado Pago",
          currency:
            "BRL",
          value:
            Number(
              ped.valor||
              0
            ),
          shipping:
            Number(
              ped.frete||
              0
            ),
          items:
            ped.itens||
            []
        }
      );

      localStorage.setItem(
        k,
        "1"
      );
    }

    localStorage.removeItem(k);
    localStorage.removeItem(C.ga);
    localStorage.removeItem(C.ship);

  }else if(
    status==="pending" ||
    status==="in_process"
  ){

    ga(
      "payment_pending",
      {
        payment_id:
          String(id),
        currency:
          "BRL",
        value:
          Number(
            ped?.valor||
            0
          )
      }
    );

  }else if(
    [
      "failure",
      "rejected",
      "cancelled"
    ].includes(status)
  ){

    ga(
      "payment_failure",
      {
        payment_id:
          String(id),
        payment_status:
          status,
        currency:
          "BRL",
        value:
          Number(
            ped?.valor||
            0
          )
      }
    );
  }
}

function esconderNativo(){
  [
    "a[href='/cart']",
    "a[href^='/checkout']",
    ".header-actions-action--cart",
    ".sqs-cart-dropzone",
    ".cart-container"
  ].forEach(
    s=>
      document
        .querySelectorAll(s)
        .forEach(
          e=>{
            if(
              !e.closest(
                "#ojb-carrinho"
              )
            ){
              e.style.display=
                "none";
            }
          }
        )
  );
}

function iniciar(){
  retornoPagamento();

  criarInterface();

  esconderNativo();

  configurarProduto();

  let n=0;

  const it=
    setInterval(
      ()=>{
        n++;

        esconderNativo();

        if(
          configurarProduto() ||
          n>=20
        ){
          clearInterval(it);
        }
      },
      500
    );

  new MutationObserver(
    ()=>{
      esconderNativo();

      if(
        !produtoConfigurado
      ){
        configurarProduto();
      }
    }
  ).observe(
    document.documentElement,
    {
      childList:true,
      subtree:true
    }
  );
}

if(
  document.readyState===
  "loading"
){
  document.addEventListener(
    "DOMContentLoaded",
    iniciar
  );
}else{
  iniciar();
}

})();
</script>
