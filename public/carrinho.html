</style>

<script>
(function () {
  "use strict";

  if (
    window.location.pathname.startsWith("/config") ||
    window.location.hostname.includes("account.squarespace.com")
  ) {
    return;
  }

  const CONFIGURACAO = {
    backend: "https://squarespace-mercadopago.onrender.com",

    armazenamento: "ojobosco-carrinho-v2",
    armazenamentoFrete: "ojobosco-frete-v1",
    armazenamentoPedidoGA4: "ojobosco-pedido-pendente-ga4",

    cupomCodigo: "BEMVINDO",
    cupomPercentual: 10,
    cupomFreteGratis: "CAMILAGUS",

    produtosPorUrl: {}
  };

  let freteAtual = null;
  let regiaoAtual = "";
  let produtoConfigurado = false;
  let visualizacaoProdutoRegistrada = false;
  let inicioCheckoutRegistrado = false;
  let cupomAplicado = false;
  let cupomFreteGratisAplicado = false;

  function enviarEventoGA4(nome, parametros) {
    const dados = parametros || {};

    if (typeof window.gtag === "function") {
      window.gtag("event", nome, dados);
      return;
    }

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: nome,
      ...dados
    });
  }

  function itemGA4(item) {
    return {
      item_id: String(item.produtoId || item.chave || ""),
      item_name: String(item.nome || "Produto OJOBOSCO"),
      item_variant: String(item.tamanho || ""),
      price: Number(item.preco || 0),
      quantity: Number(item.quantidade || 1)
    };
  }

  function itensCarrinhoGA4(carrinho) {
    return (carrinho || lerCarrinho()).map(itemGA4);
  }

  function prazoEntregaPorRegiao(regiao) {
    const texto = normalizarTexto(regiao || "");

    if (
      texto.includes("RECIFE") ||
      texto.includes("REGIAO METROPOLITANA") ||
      texto.includes("METROPOLITANA")
    ) {
      return 2;
    }

    return 10;
  }

  function textoResultadoFrete(frete, regiao) {
    const prazo = prazoEntregaPorRegiao(regiao);
    const linhaRegiao = regiao ? " — " + regiao : "";

    return (
      "Frete: " +
      formatarMoeda(frete) +
      linhaRegiao +
      "\nPrazo de entrega: até " +
      prazo +
      " dias úteis."
    );
  }

  function guardarFrete(dados) {
    try {
      localStorage.setItem(
        CONFIGURACAO.armazenamentoFrete,
        JSON.stringify(dados)
      );
    } catch {
    }
  }

  function lerFreteGuardado() {
    try {
      return JSON.parse(
        localStorage.getItem(CONFIGURACAO.armazenamentoFrete) || "null"
      );
    } catch {
      return null;
    }
  }

  function aplicarFreteGuardado() {
    const dados = lerFreteGuardado();

    if (!dados || !dados.cep || !Number.isFinite(Number(dados.frete))) {
      return;
    }

    definirValor("ojb-cep", formatarCep(dados.cep));
    definirValor("ojb-rua", dados.rua);
    definirValor("ojb-bairro", dados.bairro);
    definirValor("ojb-cidade", dados.cidade);
    definirValor("ojb-estado", dados.estado);

    freteAtual = Number(dados.frete);
    regiaoAtual = dados.regiao || "";

    atualizarResumoCheckout();
  }

  function registrarRetornoPagamento() {
    const parametros = new URLSearchParams(window.location.search);
    const status = String(parametros.get("status") || "").toLowerCase();

    const pagamentoId =
      parametros.get("payment_id") ||
      parametros.get("collection_id") ||
      parametros.get("merchant_order_id") ||
      "";

    if (!status) {
      return;
    }

    let pedido = null;

    try {
      pedido = JSON.parse(
        localStorage.getItem(
          CONFIGURACAO.armazenamentoPedidoGA4
        ) || "null"
      );
    } catch {
      pedido = null;
    }

    if (status === "approved" && pedido && pagamentoId) {
      const chaveRegistro =
        "ojobosco-compra-ga4-" + pagamentoId;

      if (!localStorage.getItem(chaveRegistro)) {
        enviarEventoGA4("purchase", {
          transaction_id: String(pagamentoId),
          affiliation: "OJOBOSCO - Mercado Pago",
          currency: "BRL",
          value: Number(pedido.valor || 0),
          shipping: Number(pedido.frete || 0),
          items: pedido.itens || []
        });

        localStorage.setItem(chaveRegistro, "1");
      }

      localStorage.removeItem(chaveRegistro);
      localStorage.removeItem(
        CONFIGURACAO.armazenamentoPedidoGA4
      );
      localStorage.removeItem(
        CONFIGURACAO.armazenamentoFrete
      );

      return;
    }

    if (
      status === "pending" ||
      status === "in_process"
    ) {
      enviarEventoGA4("payment_pending", {
        payment_id: String(pagamentoId || ""),
        currency: "BRL",
        value: Number(pedido?.valor || 0)
      });

      return;
    }

    if (
      status === "failure" ||
      status === "rejected" ||
      status === "cancelled"
    ) {
      enviarEventoGA4("payment_failure", {
        payment_id: String(pagamentoId || ""),
        payment_status: status,
        currency: "BRL",
        value: Number(pedido?.valor || 0)
      });
    }
  }

  function somenteNumeros(valor) {
    return String(valor || "").replace(/\D/g, "");
  }

  function normalizarTexto(valor) {
    return String(valor || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .replace(/\s+/g, " ")
      .toUpperCase();
  }

  function formatarMoeda(valor) {
    const numero = Number(valor);

    if (!Number.isFinite(numero)) {
      return "R$ 0,00";
    }

    return numero.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });
  }

  function formatarCep(valor) {
    const numeros =
      somenteNumeros(valor).slice(0, 8);

    if (numeros.length <= 5) {
      return numeros;
    }

    return (
      numeros.slice(0, 5) +
      "-" +
      numeros.slice(5)
    );
  }

  function formatarTelefone(valor) {
    let numeros = somenteNumeros(valor);

    if (
      numeros.startsWith("55") &&
      numeros.length > 11
    ) {
      numeros = numeros.slice(2);
    }

    numeros = numeros.slice(0, 11);

    if (numeros.length <= 2) {
      return numeros;
    }

    if (numeros.length <= 6) {
      return (
        "(" +
        numeros.slice(0, 2) +
        ") " +
        numeros.slice(2)
      );
    }

    if (numeros.length <= 10) {
      return (
        "(" +
        numeros.slice(0, 2) +
        ") " +
        numeros.slice(2, 6) +
        "-" +
        numeros.slice(6)
      );
    }

    return (
      "(" +
      numeros.slice(0, 2) +
      ") " +
      numeros.slice(2, 7) +
      "-" +
      numeros.slice(7)
    );
  }

  function lerCarrinho() {
    try {
      const dados = JSON.parse(
        localStorage.getItem(
          CONFIGURACAO.armazenamento
        ) || "[]"
      );

      return Array.isArray(dados)
        ? dados
        : [];
    } catch {
      return [];
    }
  }

  function salvarCarrinho(carrinho) {
    localStorage.setItem(
      CONFIGURACAO.armazenamento,
      JSON.stringify(carrinho)
    );

    atualizarInterfaceCarrinho();
  }

  function quantidadeTotalCarrinho() {
    return lerCarrinho().reduce(
      (total, item) =>
        total +
        Number(item.quantidade || 0),
      0
    );
  }

  function subtotalCarrinho() {
    return lerCarrinho().reduce(
      (total, item) =>
        total +
        Number(item.preco || 0) *
        Number(item.quantidade || 0),
      0
    );
  }

  function obterPrecoVisivel() {
    const seletores = [
      ".ProductItem-details-price",
      ".product-price",
      ".sqs-money-native",
      "[data-test='product-price']",
      ".product-price-value",
      ".price"
    ];

    for (const seletor of seletores) {
      const elementos =
        Array.from(
          document.querySelectorAll(seletor)
        );

      for (const elemento of elementos) {
        const estilo =
          window.getComputedStyle(elemento);

        if (
          estilo.display === "none" ||
          estilo.visibility === "hidden"
        ) {
          continue;
        }

        const texto =
          String(elemento.textContent || "");

        const correspondencia =
          texto.match(
            /R\$\s*([\d.]+(?:,\d{2})?)/
          );

        if (correspondencia) {
          const numero = Number(
            correspondencia[1]
              .replace(/\./g, "")
              .replace(",", ".")
          );

          if (
            Number.isFinite(numero) &&
            numero > 0
          ) {
            return numero;
          }
        }
      }
    }

    return 0;
  }

  function obterNomeProduto() {
    const seletores = [
      ".ProductItem-details-title",
      ".product-title",
      "[data-test='product-title']",
      "main h1",
      "h1"
    ];

    for (const seletor of seletores) {
      const elemento =
        document.querySelector(seletor);

      const texto =
        String(
          elemento?.textContent || ""
        ).trim();

      if (texto) {
        return texto;
      }
    }

    return (
      document.title
        .split("|")[0]
        .trim() ||
      "Produto OJOBOSCO"
    );
  }

  function obterImagemProduto() {
    const seletores = [
      ".ProductItem-gallery img",
      ".product-gallery img",
      "[data-test='product-image'] img",
      ".ProductItem img",
      "main img"
    ];

    for (const seletor of seletores) {
      const elemento =
        document.querySelector(seletor);

      const url =
        elemento?.currentSrc ||
        elemento?.src ||
        elemento?.getAttribute("data-src");

      if (url) {
        return url;
      }
    }

    return "";
  }

  function obterQuantidadeProduto() {
    const seletores = [
      "input[name='quantity']",
      ".product-quantity-input input",
      ".ProductItem-details input[type='number']",
      "input[type='number']"
    ];

    for (const seletor of seletores) {
      const elemento =
        document.querySelector(seletor);

      if (
        elemento &&
        !elemento.closest("#ojb-carrinho")
      ) {
        const quantidade =
          Number(elemento.value);

        if (
          Number.isInteger(quantidade) &&
          quantidade > 0
        ) {
          return quantidade;
        }
      }
    }

    return 1;
  }

  function obterTamanhoSelecionado() {
    const selects =
      Array.from(
        document.querySelectorAll("select")
      );

    for (const select of selects) {
      if (select.closest("#ojb-carrinho")) {
        continue;
      }

      const nome = normalizarTexto(
        select.name ||
        select.id ||
        select.getAttribute("aria-label") ||
        ""
      );

      const opcao =
        select.options[
          select.selectedIndex
        ];

      const textoOpcao = opcao
        ? String(
            opcao.textContent ||
            opcao.value ||
            ""
          ).trim()
        : "";

      const ehOpcaoProduto =
        nome.includes("TAMANHO") ||
        nome.includes("SIZE") ||
        nome.includes("FRAGRANCIA") ||
        nome.includes("AROMA") ||
        nome.includes("COR") ||
        textoOpcao.match(
          /\b\d+\s*(ML|G|KG|L)\b/i
        );

      if (ehOpcaoProduto) {
        if (
          !textoOpcao ||
          normalizarTexto(
            textoOpcao
          ).includes("SELECIONE")
        ) {
          return "";
        }

        return textoOpcao;
      }
    }

    const radiosMarcados =
      Array.from(
        document.querySelectorAll(
          "input[type='radio']:checked"
        )
      );

    for (const radio of radiosMarcados) {
      if (radio.closest("#ojb-carrinho")) {
        continue;
      }

      const label =
        radio.id
          ? document.querySelector(
              'label[for="' +
              CSS.escape(radio.id) +
              '"]'
            )
          : null;

      const texto =
        String(
          label?.textContent ||
          radio.value ||
          ""
        ).trim();

      if (texto) {
        return texto;
      }
    }

    const selecionados =
      Array.from(
        document.querySelectorAll(
          [
            ".variant-option.selected",
            ".variant-radiobtn-wrapper input:checked + label",
            "[aria-checked='true']",
            ".ProductItem-variant-option--selected"
          ].join(",")
        )
      );

    for (const elemento of selecionados) {
      if (
        elemento.closest("#ojb-carrinho")
      ) {
        continue;
      }

      const texto =
        String(
          elemento.textContent ||
          elemento.getAttribute("value") ||
          elemento.getAttribute(
            "aria-label"
          ) ||
          ""
        ).trim();

      if (texto) {
        return texto;
      }
    }

    return "";
  }

  function obterVarianteIdSelecionada() {
    const elementos =
      Array.from(
        document.querySelectorAll(
          [
            "[data-variant-id]",
            "[data-selected-variant-id]",
            "option:checked"
          ].join(",")
        )
      );

    for (const elemento of elementos) {
      if (
        elemento.closest("#ojb-carrinho")
      ) {
        continue;
      }

      const valor =
        elemento.getAttribute(
          "data-variant-id"
        ) ||
        elemento.getAttribute(
          "data-selected-variant-id"
        ) ||
        elemento.value;

      if (
        valor &&
        /^[a-f0-9]{20,40}$/i.test(
          String(valor)
        )
      ) {
        return String(valor);
      }
    }

    return "";
  }

  function obterProdutoId() {
    const caminho =
      window.location.pathname.replace(
        /\/+$/,
        ""
      );

    if (
      CONFIGURACAO.produtosPorUrl[
        caminho
      ]
    ) {
      return (
        CONFIGURACAO.produtosPorUrl[
          caminho
        ]
      );
    }

    const atributos = [
      "data-item-id",
      "data-product-id",
      "data-itemid",
      "data-productid"
    ];

    for (const atributo of atributos) {
      const elementos =
        Array.from(
          document.querySelectorAll(
            "[" + atributo + "]"
          )
        );

      for (const elemento of elementos) {
        const valor =
          elemento.getAttribute(
            atributo
          );

        if (
          valor &&
          /^[a-f0-9]{20,40}$/i.test(
            valor
          )
        ) {
          return valor;
        }
      }
    }

    const metas = [
      "meta[itemprop='productID']",
      "meta[property='product:retailer_item_id']",
      "meta[name='product-id']"
    ];

    for (const seletor of metas) {
      const elemento =
        document.querySelector(seletor);

      const valor =
        elemento?.content ||
        elemento?.getAttribute(
          "content"
        );

      if (
        valor &&
        /^[a-f0-9]{20,40}$/i.test(
          valor
        )
      ) {
        return valor;
      }
    }

    const scripts =
      Array.from(
        document.querySelectorAll(
          "script:not([src])"
        )
      );

    const padroes = [
      /"productId"\s*:\s*"([a-f0-9]{20,40})"/i,
      /"product_id"\s*:\s*"([a-f0-9]{20,40})"/i,
      /"itemId"\s*:\s*"([a-f0-9]{20,40})"/i,
      /"item_id"\s*:\s*"([a-f0-9]{20,40})"/i
    ];

    for (const script of scripts) {
      const texto =
        String(
          script.textContent || ""
        );

      for (const padrao of padroes) {
        const resultado =
          texto.match(padrao);

        if (resultado?.[1]) {
          return resultado[1];
        }
      }
    }

    return "";
  }

  function localizarBotaoNativo() {
    const seletores = [
      ".sqs-add-to-cart-button",
      "[data-test='add-to-cart-button']",
      ".ProductItem-details .sqs-block-button-element",
      "button[type='submit']"
    ];

    for (const seletor of seletores) {
      const elementos =
        Array.from(
          document.querySelectorAll(
            seletor
          )
        );

      const botao =
        elementos.find(
          function (item) {
            if (
              item.closest(
                "#ojb-carrinho"
              )
            ) {
              return false;
            }

            const texto =
              normalizarTexto(
                item.textContent ||
                item.value ||
                item.getAttribute(
                  "aria-label"
                )
              );

            return (
              texto.includes(
                "ADICIONAR"
              ) ||
              texto.includes(
                "CARRINHO"
              ) ||
              texto.includes(
                "ADD TO CART"
              )
            );
          }
        );

      if (botao) {
        return botao;
      }
    }

    return null;
  }

  function mensagemProduto(
    texto,
    tipo
  ) {
    const elemento =
      document.getElementById(
        "ojb-aviso-produto"
      );

    if (!elemento) {
      return;
    }

    elemento.textContent = texto;

    elemento.className =
      tipo === "sucesso"
        ? "ojb-sucesso"
        : "ojb-erro";
  }

  function adicionarProdutoAtual() {
    const botao =
      document.getElementById(
        "ojb-adicionar-carrinho"
      );

    try {
      botao.disabled = true;
      botao.textContent =
        "Adicionando...";

      const produtoId =
        obterProdutoId();

      const tamanho =
        obterTamanhoSelecionado();

      const varianteId =
        obterVarianteIdSelecionada();

      const quantidade =
        obterQuantidadeProduto();

      const nome =
        obterNomeProduto();

      const preco =
        obterPrecoVisivel();

      const imagem =
        obterImagemProduto();

      if (!produtoId) {
        throw new Error(
          "Não foi possível identificar este produto. Será necessário cadastrar o ID dele no código."
        );
      }

      if (!tamanho) {
        throw new Error(
          "Selecione uma opção do produto."
        );
      }

      if (
        !Number.isInteger(
          quantidade
        ) ||
        quantidade < 1
      ) {
        throw new Error(
          "Informe uma quantidade válida."
        );
      }

      const carrinho =
        lerCarrinho();

      const chave =
        produtoId +
        "::" +
        (
          varianteId ||
          normalizarTexto(
            tamanho
          )
        );

      const existente =
        carrinho.find(
          (item) =>
            item.chave === chave
        );

      if (existente) {
        existente.quantidade +=
          quantidade;

        existente.nome =
          nome;

        existente.preco =
          preco;

        existente.imagem =
          imagem;
      } else {
        carrinho.push({
          chave,
          produtoId,
          varianteId,
          tamanho,
          quantidade,
          nome,
          preco,
          imagem
        });
      }

      salvarCarrinho(carrinho);

      enviarEventoGA4(
        "add_to_cart",
        {
          currency: "BRL",

          value:
            Number(
              preco || 0
            ) *
            quantidade,

          items: [
            itemGA4({
              produtoId,
              nome,
              tamanho,
              preco,
              quantidade
            })
          ]
        }
      );

      mensagemProduto(
        "Produto adicionado ao carrinho.",
        "sucesso"
      );

      abrirCarrinho();
    } catch (erro) {
      mensagemProduto(
        erro.message ||
        "Não foi possível adicionar o produto.",
        "erro"
      );
    } finally {
      botao.disabled = false;

      botao.textContent =
        "Adicionar ao carrinho";
    }
  }

  async function calcularFreteProduto() {
    const campo =
      document.getElementById(
        "ojb-cep-produto"
      );

    const botao =
      document.getElementById(
        "ojb-calcular-frete-produto"
      );

    const resultado =
      document.getElementById(
        "ojb-resultado-frete-produto"
      );

    const cep =
      somenteNumeros(
        campo?.value
      );

    if (
      !campo ||
      !botao ||
      !resultado
    ) {
      return;
    }

    if (cep.length !== 8) {
      resultado.textContent =
        "Informe um CEP válido com 8 números.";

      resultado.className =
        "ojb-erro";

      campo.focus();
      return;
    }

    botao.disabled = true;

    botao.textContent =
      "Calculando...";

    resultado.textContent = "";
    resultado.className = "";

    try {
      const resposta =
        await fetch(
          CONFIGURACAO.backend +
          "/calcular-frete?cep=" +
          encodeURIComponent(
            cep
          ),
          {
            method: "GET",

            headers: {
              Accept:
                "application/json"
            }
          }
        );

      const dados =
        await resposta.json();

      if (!resposta.ok) {
        throw new Error(
          dados.erro ||
          "Não foi possível consultar esse CEP."
        );
      }

      const frete =
        Number(dados.frete);

      if (!Number.isFinite(frete)) {
        throw new Error(
          "O valor do frete não foi retornado."
        );
      }

      campo.value =
        formatarCep(
          dados.cep || cep
        );

      freteAtual = frete;

      regiaoAtual =
        dados.regiao || "";

      guardarFrete({
        cep:
          dados.cep || cep,

        rua:
          dados.rua || "",

        bairro:
          dados.bairro || "",

        cidade:
          dados.cidade || "",

        estado:
          dados.estado || "",

        frete,

        regiao:
          dados.regiao || ""
      });

      aplicarFreteGuardado();

      resultado.textContent =
        textoResultadoFrete(
          frete,
          regiaoAtual
        );

      resultado.className =
        "ojb-sucesso";

      enviarEventoGA4(
        "add_shipping_info",
        {
          currency:
            "BRL",

          value:
            subtotalCarrinho() ||
            obterPrecoVisivel(),

          shipping_tier:
            (
              regiaoAtual ||
              "Frete por CEP"
            ) +
            " | até " +
            prazoEntregaPorRegiao(
              regiaoAtual
            ) +
            " dias úteis",

          items:
            lerCarrinho().length
              ? itensCarrinhoGA4()
              : [
                  itemGA4({
                    produtoId:
                      obterProdutoId(),

                    nome:
                      obterNomeProduto(),

                    tamanho:
                      obterTamanhoSelecionado(),

                    preco:
                      obterPrecoVisivel(),

                    quantidade:
                      obterQuantidadeProduto()
                  })
                ]
        }
      );
    } catch (erro) {
      resultado.textContent =
        erro.message ||
        "Não foi possível calcular o frete.";

      resultado.className =
        "ojb-erro";
    } finally {
      botao.disabled = false;

      botao.textContent =
        "Calcular frete";
    }
  }

  function configurarPaginaProduto() {
    if (produtoConfigurado) {
      return true;
    }

    const botaoNativo =
      localizarBotaoNativo();

    if (!botaoNativo) {
      return false;
    }

    const recipiente =
      botaoNativo.closest(
        ".sqs-add-to-cart-button-wrapper"
      ) ||
      botaoNativo.parentElement;

    if (!recipiente) {
      return false;
    }

    const botao =
      document.createElement(
        "button"
      );

    botao.id =
      "ojb-adicionar-carrinho";

    botao.type =
      "button";

    botao.textContent =
      "Adicionar ao carrinho";

    const mensagem =
      document.createElement(
        "div"
      );

    mensagem.id =
      "ojb-aviso-produto";

    mensagem.setAttribute(
      "aria-live",
      "polite"
    );

    const calculadoraFrete =
      document.createElement(
        "div"
      );

    calculadoraFrete.id =
      "ojb-calculadora-frete-produto";

    calculadoraFrete.innerHTML = `
      <div class="ojb-frete-linha">

        <input
          id="ojb-cep-produto"
          type="text"
          inputmode="numeric"
          autocomplete="postal-code"
          maxlength="9"
          placeholder="Digite seu CEP"
          aria-label="CEP para cálculo do frete"
        >

        <button
          id="ojb-calcular-frete-produto"
          type="button"
        >
          Calcular frete
        </button>

      </div>

      <div
        id="ojb-resultado-frete-produto"
        aria-live="polite"
      ></div>
    `;

    recipiente.insertAdjacentElement(
      "beforebegin",
      botao
    );

    botao.insertAdjacentElement(
      "afterend",
      mensagem
    );

    const formularioProduto =
      botaoNativo.closest(
        "form"
      );

    const blocoProduto =
      formularioProduto ||
      botaoNativo.closest(
        ".ProductItem-details, .product-details, [data-test='product-details']"
      );

    if (
      blocoProduto?.parentElement
    ) {
      blocoProduto.insertAdjacentElement(
        "afterend",
        calculadoraFrete
      );
    } else {
      mensagem.insertAdjacentElement(
        "afterend",
        calculadoraFrete
      );
    }

    recipiente.style.display =
      "none";

    botao.addEventListener(
      "click",
      adicionarProdutoAtual
    );

    document
      .getElementById(
        "ojb-calcular-frete-produto"
      )
      ?.addEventListener(
        "click",
        calcularFreteProduto
      );

    document
      .getElementById(
        "ojb-cep-produto"
      )
      ?.addEventListener(
        "input",
        function () {
          this.value =
            formatarCep(
              this.value
            );
        }
      );

    document
      .getElementById(
        "ojb-cep-produto"
      )
      ?.addEventListener(
        "keydown",
        function (evento) {
          if (
            evento.key ===
            "Enter"
          ) {
            evento.preventDefault();

            calcularFreteProduto();
          }
        }
      );

    const freteGuardado =
      lerFreteGuardado();

    if (freteGuardado?.cep) {
      const campoCepProduto =
        document.getElementById(
          "ojb-cep-produto"
        );

      const resultadoFreteProduto =
        document.getElementById(
          "ojb-resultado-frete-produto"
        );

      if (campoCepProduto) {
        campoCepProduto.value =
          formatarCep(
            freteGuardado.cep
          );
      }

      if (
        resultadoFreteProduto
      ) {
        resultadoFreteProduto.textContent =
          textoResultadoFrete(
            freteGuardado.frete,
            freteGuardado.regiao ||
            ""
          );

        resultadoFreteProduto.className =
          "ojb-sucesso";
      }
    }

    if (
      !visualizacaoProdutoRegistrada
    ) {
      enviarEventoGA4(
        "view_item",
        {
          currency: "BRL",

          value:
            obterPrecoVisivel(),

          items: [
            itemGA4({
              produtoId:
                obterProdutoId(),

              nome:
                obterNomeProduto(),

              tamanho:
                obterTamanhoSelecionado(),

              preco:
                obterPrecoVisivel(),

              quantidade:
                1
            })
          ]
        }
      );

      visualizacaoProdutoRegistrada =
        true;
    }

    produtoConfigurado =
      true;

    return true;
  }

  function alterarQuantidade(
    indice,
    diferenca
  ) {
    const carrinho =
      lerCarrinho();

    if (!carrinho[indice]) {
      return;
    }

    carrinho[indice].quantidade +=
      diferenca;

    if (
      carrinho[indice]
        .quantidade <= 0
    ) {
      carrinho.splice(
        indice,
        1
      );
    }

    freteAtual =
      null;

    regiaoAtual =
      "";

    salvarCarrinho(
      carrinho
    );
  }

  function removerItem(indice) {
    const carrinho =
      lerCarrinho();

    carrinho.splice(
      indice,
      1
    );

    freteAtual =
      null;

    regiaoAtual =
      "";

    salvarCarrinho(
      carrinho
    );
  }

  function atualizarInterfaceCarrinho() {
    const carrinho =
      lerCarrinho();

    const contador =
      document.getElementById(
        "ojb-contador-carrinho"

      contador.textContent =
        String(
          quantidadeTotalCarrinho()
        );
    }

    const lista =
      document.getElementById(
        "ojb-lista-carrinho"
      );

    if (!lista) {
      return;
    }

    if (
      carrinho.length === 0
    ) {
      lista.innerHTML = `

          Seu carrinho está vazio.

        document.getElementById(
          "ojb-acoes-carrinho"

          "none";
      }

      mostrarListaCarrinho();

      return;

    const acoes =
      document.getElementById(
        "ojb-acoes-carrinho"
      );

    if (acoes) {
      acoes.style.display =
        "";
    }

    lista.innerHTML =
      carrinho
        .map(
          function (
            item,
            indice
          ) {
            const imagem =
              item.imagem
                ? `

                    <img
                      src="${item.imagem}"
                      alt=""
                    >

                  </div>
                `
                : `
                  <div class="ojb-item-sem-imagem">
                    OJOBOSCO

                `;

            return `
              <article class="ojb-item">

                ${imagem}

                <div>

                  <p class="ojb-item-nome">
                    ${
                      item.nome ||
                      "Produto OJOBOSCO"

                  </p>

                    ${
                      item.tamanho ||
                      ""

                        ? formatarMoeda(

                      Remover

                  </div>

                </div>

                <div class="ojb-item-subtotal">

                  ${
                    item.preco
                      ? formatarMoeda(
                          item.preco *
                          item.quantidade
                        )
                      : ""
                  }

                </div>

              </article>
            `;
          }
        )
        .join("");

    lista
      .querySelectorAll(
        "[data-ojb-diminuir]"
      )
      .forEach(
        function (botao) {
          botao.addEventListener(
            "click",
            function () {
              alterarQuantidade(
                Number(
                  this.dataset
                    .ojbDiminuir
                ),
                -1
              );
            }
          );
        }
      );

    lista
      .querySelectorAll(
        "[data-ojb-aumentar]"
      )
      .forEach(
        function (botao) {
          botao.addEventListener(
            "click",
            function () {
              alterarQuantidade(
                Number(
                  this.dataset
                    .ojbAumentar
                ),
                1
              );
            }
          );
        }
      );

    lista
      .querySelectorAll(
        "[data-ojb-remover]"
      )
      .forEach(
        function (botao) {
          botao.addEventListener(
            "click",
            function () {
              removerItem(
                Number(
                  this.dataset
                    .ojbRemover
                )
              );
            }
          );
        }
      );

    const subtotal =
      subtotalCarrinho();

    const subtotalElemento =
      document.getElementById(
        "ojb-subtotal-carrinho"
      );

    if (
      subtotalElemento
    ) {
      subtotalElemento.textContent =
        subtotal > 0
          ? formatarMoeda(
              subtotal
            )
          : "Confirmado no pagamento";
    }

    atualizarResumoCheckout();
  }

  function obterValor(id) {
    return String(
      document
        .getElementById(id)
        ?.value ||
      ""
    ).trim();
  }

  function definirValor(
    id,
    valor
  ) {
    const elemento =
      document.getElementById(
        id
      );

    if (elemento) {
      elemento.value =
        valor || "";
    }
  }

  function mostrarMensagem(
    texto,
    tipo
  ) {
    const elemento =
      document.getElementById(
        "ojb-mensagem"
      );

    if (!elemento) {
      return;
    }

    elemento.textContent =
      texto;

    elemento.className =
      tipo === "sucesso"
        ? "ojb-sucesso"
        : "ojb-erro";
  }

  function limparMensagem() {
    const elemento =
      document.getElementById(
        "ojb-mensagem"
      );

    if (!elemento) {
      return;
    }

    elemento.textContent =
      "";

    elemento.className =
      "";
  }

  function valorDescontoCarrinho() {
    if (!cupomAplicado) {
      return 0;
    }

    return Number(
      (
        subtotalCarrinho() *
        (
          CONFIGURACAO
            .cupomPercentual /
          100
        )
      ).toFixed(2)
    );
  }

  function valorProdutosComDesconto() {
    return Math.max(
      0,
      subtotalCarrinho() -
      valorDescontoCarrinho()
    );
  }

  function freteEfetivoCarrinho() {
    if (
      freteAtual === null
    ) {
      return null;
    }

    if (
      cupomFreteGratisAplicado
    ) {
      return 0;
    }

    if (
      valorProdutosComDesconto() >=
      500
    ) {
      return 0;
    }

    return Number(
      freteAtual
    );
  }

  function aplicarCupom() {
    const campo =
      document.getElementById(
        "ojb-cupom"
      );

    const mensagem =
      document.getElementById(
        "ojb-cupom-mensagem"
      );

    const codigo =
      normalizarTexto(
        campo?.value
      );

    if (
      !campo ||
      !mensagem
    ) {
      return;
    }

    if (!codigo) {
      cupomAplicado =
        false;

      cupomFreteGratisAplicado =
        false;

      mensagem.textContent =
        "Digite o código de desconto.";

      mensagem.className =
        "ojb-erro";

      atualizarResumoCheckout();

      return;
    }

    if (
      codigo ===
      CONFIGURACAO.cupomCodigo
    ) {
      cupomAplicado =
        true;

      cupomFreteGratisAplicado =
        false;

      campo.value =
        CONFIGURACAO
          .cupomCodigo;

      mensagem.textContent =
        "Desconto de " +
        CONFIGURACAO
          .cupomPercentual +
        "% aplicado.";

      mensagem.className =
        "ojb-sucesso";

      atualizarResumoCheckout();

      return;
    }

    if (
      codigo ===
      CONFIGURACAO
        .cupomFreteGratis
    ) {
      cupomAplicado =
        false;

      cupomFreteGratisAplicado =
        true;

      campo.value =
        CONFIGURACAO
          .cupomFreteGratis;

      mensagem.textContent =
        "Frete grátis aplicado.";

      mensagem.className =
        "ojb-sucesso";

      atualizarResumoCheckout();

      return;
    }

    cupomAplicado =
      false;

    cupomFreteGratisAplicado =
      false;

    mensagem.textContent =
      "Código de desconto inválido.";

    mensagem.className =
      "ojb-erro";

    atualizarResumoCheckout();
  }

  function atualizarResumoCheckout() {
    const subtotal =
      subtotalCarrinho();

    const subtotalElemento =
      document.getElementById(
        "ojb-checkout-subtotal"
      );

    const desconto =
      valorDescontoCarrinho();

    const freteEfetivo =
      freteEfetivoCarrinho();

    const linhaDesconto =
      document.getElementById(
        "ojb-linha-desconto"
      );

    const descontoElemento =
      document.getElementById(
        "ojb-checkout-desconto"
      );

    const freteElemento =
      document.getElementById(
        "ojb-checkout-frete"
      );

    const totalElemento =
      document.getElementById(
        "ojb-checkout-total"
      );

    const regiaoElemento =
      document.getElementById(
        "ojb-regiao"
      );

    if (subtotalElemento) {
      subtotalElemento.textContent =
        subtotal > 0
          ? formatarMoeda(
              subtotal
            )
          : "Confirmado no pagamento";
    }

    if (linhaDesconto) {
      linhaDesconto.style.display =
        cupomAplicado
          ? "flex"
          : "none";
    }

    if (
      descontoElemento
    ) {
      descontoElemento.textContent =
        "-" +
        formatarMoeda(
          desconto
        );
    }

    if (freteElemento) {
      if (
        freteEfetivo ===
        null
      ) {
        freteElemento.textContent =
          "Informe o CEP";
      } else if (
        freteEfetivo ===
        0
      ) {
        freteElemento.textContent =
          "Frete grátis";
      } else {
        freteElemento.textContent =
          formatarMoeda(
            freteEfetivo
          );
      }
    }

    if (totalElemento) {
      totalElemento.textContent =
        subtotal > 0 &&
        freteEfetivo !== null
          ? formatarMoeda(
              subtotal -
              desconto +
              Number(
                freteEfetivo
              )
            )
          : "—";
    }

    if (regiaoElemento) {
      const prazo =
        prazoEntregaPorRegiao(
          regiaoAtual
        );

      if (regiaoAtual) {
        regiaoElemento.textContent =
          freteEfetivo === 0
            ? "Entrega: " +
              regiaoAtual +
              " • Frete grátis • Prazo: até " +
              prazo +
              " dias úteis"
            : "Entrega: " +
              regiaoAtual +
              " • Prazo: até " +
              prazo +
              " dias úteis";
      } else {
        regiaoElemento.textContent =
          "";
      }
    }
  }

  async function buscarCep() {
    limparMensagem();

    const cep =
      somenteNumeros(
        obterValor(
          "ojb-cep"
        )
      );

    if (
      cep.length !== 8
    ) {
      mostrarMensagem(
        "Informe um CEP válido com 8 números.",
        "erro"
      );

      return;
    }

    const botao =
      document.getElementById(
        "ojb-buscar-cep"
      );

    botao.disabled =
      true;

    botao.textContent =
      "Buscando...";

    try {
      const resposta =
        await fetch(
          CONFIGURACAO.backend +
          "/calcular-frete?cep=" +
          encodeURIComponent(
            cep
          ),
          {
            method:
              "GET",

            headers: {
              Accept:
                "application/json"
            }
          }
        );

      const dados =
        await resposta.json();

      if (
        !resposta.ok
      ) {
        throw new Error(
          dados.erro ||
          "Não foi possível consultar esse CEP."
        );
      }

      definirValor(
        "ojb-cep",
        formatarCep(
          dados.cep
        )
      );

      definirValor(
        "ojb-rua",
        dados.rua
      );

      definirValor(
        "ojb-bairro",
        dados.bairro
      );

      definirValor(
        "ojb-cidade",
        dados.cidade
      );

      definirValor(
        "ojb-estado",
        dados.estado
      );

      freteAtual =
        Number(
          dados.frete
        );

      regiaoAtual =
        dados.regiao ||
        "";

      guardarFrete({
        cep:
          dados.cep ||
          cep,

        rua:
          dados.rua ||
          "",

        bairro:
          dados.bairro ||
          "",

        cidade:
          dados.cidade ||
          "",

        estado:
          dados.estado ||
          "",

        frete:
          freteAtual,

        regiao:
          regiaoAtual
      });

      const freteEfetivo =
        freteEfetivoCarrinho();

      enviarEventoGA4(
        "add_shipping_info",
        {
          currency:
            "BRL",

          value:
            valorProdutosComDesconto() +
            Number(
              freteEfetivo ||
              0
            ),

          shipping_tier:
            freteEfetivo === 0
              ? "Frete grátis | " +
                (
                  regiaoAtual ||
                  "Frete por CEP"
                )
              : (
                  regiaoAtual ||
                  "Frete por CEP"
                ) +
                " | até " +
                prazoEntregaPorRegiao(
                  regiaoAtual
                ) +
                " dias úteis",

          items:
            itensCarrinhoGA4()
        }
      );

      atualizarResumoCheckout();

      mostrarMensagem(
        freteEfetivo === 0
          ? "Endereço encontrado. Seu pedido ganhou frete grátis."
          : "Endereço encontrado e frete calculado.",
        "sucesso"
      );

      document
        .getElementById(
          "ojb-numero"
        )
        ?.focus();
    } catch (erro) {
      freteAtual =
        null;

      regiaoAtual =
        "";

      definirValor(
        "ojb-rua",
        ""
      );

      definirValor(
        "ojb-bairro",
        ""
      );

      definirValor(
        "ojb-cidade",
        ""
      );

      definirValor(
        "ojb-estado",
        ""
      );

      atualizarResumoCheckout();

      mostrarMensagem(
        erro.message ||
        "Não foi possível consultar o CEP.",
        "erro"
      );
    } finally {
      botao.disabled =
        false;

      botao.textContent =
        "Buscar endereço";
    }
  }

  function validarFormulario() {
    const dados = {
      nomeCompleto:
        obterValor(
          "ojb-nome"
        ),

      email:
        obterValor(
          "ojb-email"
        ),

      telefone:
        obterValor(
          "ojb-telefone"
        ),

      cep:
        somenteNumeros(
          obterValor(
            "ojb-cep"
          )
        ),

      rua:
        obterValor(
          "ojb-rua"
        ),

      numero:
        obterValor(
          "ojb-numero"
        ),

      complemento:
        obterValor(
          "ojb-complemento"
        ),

      bairro:
        obterValor(
          "ojb-bairro"
        ),

      cidade:
        obterValor(
          "ojb-cidade"
        ),

      estado:
        obterValor(
          "ojb-estado"
        )
    };

    if (
      dados.nomeCompleto
        .split(/\s+/)
        .filter(Boolean)
        .length <
      2
    ) {
      throw new Error(
        "Informe seu nome completo."
      );
    }

    if (
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        dados.email
      )
    ) {
      throw new Error(
        "Informe um e-mail válido."
      );
    }

    let telefone =
      somenteNumeros(
        dados.telefone
      );

    if (
      telefone.startsWith(
        "55"
      ) &&
      telefone.length > 11
    ) {
      telefone =
        telefone.slice(2);
    }

    if (
      telefone.length !== 10 &&
      telefone.length !== 11
    ) {
      throw new Error(
        "Informe um telefone válido com DDD."
      );
    }

    if (
      dados.cep.length !== 8
    ) {
      throw new Error(
        "Informe um CEP válido."
      );
    }

    if (
      freteAtual === null
    ) {
      throw new Error(
        "Clique em “Buscar endereço” para calcular o frete."
      );
    }

    if (!dados.rua) {
      throw new Error(
        "Informe a rua ou avenida."
      );
    }

    if (!dados.numero) {
      throw new Error(
        "Informe o número do endereço."
      );
    }

    if (!dados.bairro) {
      throw new Error(
        "Informe o bairro."
      );
    }

    if (
      !dados.cidade ||
      !dados.estado
    ) {
      throw new Error(
        "Consulte novamente o CEP."
      );
    }

    return dados;
  }

  async function criarCheckout() {
    limparMensagem();

    const botao =
      document.getElementById(
        "ojb-pagar"
      );

    try {
      const carrinho =
        lerCarrinho();

      if (
        carrinho.length === 0
      ) {
        throw new Error(
          "O carrinho está vazio."
        );
      }

      const cliente =
        validarFormulario();

      const itens =
        carrinho.map(
          function (item) {
            return {
              produtoId:
                item.produtoId,

              varianteId:
                item.varianteId ||
                "",

              tamanho:
                item.tamanho,

              quantidade:
                item.quantidade
            };
          }
        );

      botao.disabled =
        true;

      botao.textContent =
        "Preparando pagamento...";

      const itensGA4 =
        itensCarrinhoGA4(
          carrinho
        );

      const desconto =
        valorDescontoCarrinho();

      const freteEfetivo =
        freteEfetivoCarrinho();

      const valorPedido =
        subtotalCarrinho() -
        desconto +
        Number(
          freteEfetivo ||
          0
        );

      enviarEventoGA4(
        "add_payment_info",
        {
          currency:
            "BRL",

          value:
            valorPedido,

          payment_type:
            "Mercado Pago",

          items:
            itensGA4
        }
      );

      try {
        localStorage.setItem(
          CONFIGURACAO
            .armazenamentoPedidoGA4,

          JSON.stringify({
            valor:
              valorPedido,

            frete:
              Number(
                freteEfetivo ||
                0
              ),

            itens:
              itensGA4,

            criadoEm:
              new Date()
                .toISOString()
          })
        );
      } catch {
      }

      const resposta =
        await fetch(
          CONFIGURACAO.backend +
          "/criar-checkout",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json",

              Accept:
                "application/json"
            },

            body:
              JSON.stringify({
                itens,

                codigoDesconto:
                  cupomAplicado
                    ? CONFIGURACAO
                        .cupomCodigo
                    : "",

                nomeCompleto:
                  cliente
                    .nomeCompleto,

                email:
                  cliente
                    .email,

                telefone:
                  cliente
                    .telefone,

                cep:
                  cliente
                    .cep,

                rua:
                  cliente
                    .rua,

                numero:
                  cliente
                    .numero,

                complemento:
                  cliente
                    .complemento,

                bairro:
                  cliente
                    .bairro,

                cidade:
                  cliente
                    .cidade,

                estado:
                  cliente
                    .estado
              })
          }
        );

      let dados;

      try {
        dados =
          await resposta
            .json();
      } catch {
        throw new Error(
          "O servidor retornou uma resposta inválida."
        );
      }

      if (
        !resposta.ok
      ) {
        throw new Error(
          dados.erro ||
          dados.detalhes ||
          "Não foi possível criar o pagamento."
        );
      }

      if (
        !dados.checkout_url
      ) {
        throw new Error(
          "O endereço do pagamento não foi retornado."
        );
      }

      mostrarMensagem(
        "Pagamento preparado. Abrindo o Mercado Pago...",
        "sucesso"
      );

      localStorage.removeItem(
        CONFIGURACAO
          .armazenamento
      );

      window.location.href =
        dados.checkout_url;
    } catch (erro) {
      localStorage.removeItem(
        CONFIGURACAO
          .armazenamentoPedidoGA4
      );

      enviarEventoGA4(
        "checkout_error",
        {
          error_message:
            String(
              erro.message ||
              "Não foi possível continuar para o pagamento."
            )
        }
      );

      mostrarMensagem(
        erro.message ||
        "Não foi possível continuar para o pagamento.",
        "erro"
      );

      botao.disabled =
        false;

      botao.textContent =
        "Pagar com Mercado Pago";
    }
  }

  function esconderCheckoutNativo() {
    const seletores = [
      "a[href='/cart']",
      "a[href^='/checkout']",
      ".header-actions-action--cart",
      ".sqs-cart-dropzone",
      ".cart-container"
    ];

    seletores.forEach(
      function (seletor) {
        document
          .querySelectorAll(
            seletor
          )
          .forEach(
            function (
              elemento
            ) {
              if (
                !elemento.closest(
                  "#ojb-carrinho"
                )
              ) {
                elemento.style.display =
                  "none";
              }
            }
          );
      }
    );
  }

  function impedirCheckoutSquarespace() {
    document.addEventListener(
      "click",
      function (evento) {
        const link =
          evento.target.closest(
            "a[href^='/checkout'], a[href='/cart']"
          );

        if (!link) {
          return;
        }

        if (
          link.closest(
            "#ojb-carrinho"
          )
        ) {
          return;
        }

        evento.preventDefault();

        evento.stopPropagation();

        abrirCarrinho();
      },
      true
    );
  }

  function iniciar() {
    registrarRetornoPagamento();

    criarInterfaceCarrinho();

    esconderCheckoutNativo();

    impedirCheckoutSquarespace();

    configurarPaginaProduto();

    let tentativas =
      0;

    const intervalo =
      setInterval(
        function () {
          tentativas +=
            1;

          esconderCheckoutNativo();

          if (
            configurarPaginaProduto() ||
            tentativas >= 20
          ) {
            clearInterval(
              intervalo
            );
          }
        },
        500
      );

    const observador =
      new MutationObserver(
        function () {
          esconderCheckoutNativo();

          if (
            !produtoConfigurado
          ) {
            configurarPaginaProduto();
          }
        }
      );

    observador.observe(
      document.documentElement,
      {
        childList:
          true,

        subtree:
          true
      }
    );
  }

  if (
    document.readyState ===
    "loading"
  ) {
    document.addEventListener(
      "DOMContentLoaded",
      iniciar
    );
  } else {
    iniciar();
  }
})();
</script>
