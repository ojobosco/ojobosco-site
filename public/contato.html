<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Contato — OJOBOSCO</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>
    :root {
      --fonte:
        "Copperplate",
        "Copperplate Gothic Light",
        "Copperplate Gothic",
        serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: var(--fonte);
    }

    .institutional-header {
      min-height: 72px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 4vw;
      border-bottom: 1px solid #ddd;
    }

    .institutional-header-left,
    .institutional-header-right {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .institutional-header-right {
      justify-content: flex-end;
    }

    .institutional-header a {
      color: #111;
      font-size: 9px;
      letter-spacing: .08em;
      text-decoration: none;
    }

    .institutional-logo {
      font-size: 12px !important;
    }

    .institutional-page {
      min-height: 75vh;
      padding: 120px 6vw 130px;
    }

    .institutional-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .institutional-title {
      margin: 0 0 70px;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: .06em;
    }

    .institutional-block {
      padding: 34px 0;
      border-top: 1px solid #d6d6d6;
    }

    .institutional-block:last-child {
      border-bottom: 1px solid #d6d6d6;
    }

    .institutional-block h2 {
      margin: 0 0 20px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .09em;
    }

    .institutional-block p,
    .institutional-block a {
      margin: 0 0 8px;
      color: #111;
      font-size: 11px;
      line-height: 1.9;
      letter-spacing: .03em;
    }

    .institutional-block a {
      text-decoration: none;
      border-bottom: 1px solid #111;
    }

    @media (max-width: 700px) {
      .institutional-header {
        min-height: 58px;
        grid-template-columns: 1fr auto;
        padding: 0 20px;
      }

      .institutional-header-left {
        display: none;
      }

      .institutional-page {
        padding: 85px 22px 90px;
      }

      .institutional-title {
        margin-bottom: 48px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="institutional-header">

    <nav class="institutional-header-left">
      <a href="index.html">
        UNIVERSO
      </a>

      <a href="loja.html">
        LOJA
      </a>

      <a href="universo.html">
        SOBRE
      </a>
    </nav>

    <a
      href="index.html"
      class="institutional-logo"
    >
      OJOBOSCO
    </a>

    <div class="institutional-header-right">
      <a href="carrinho.html">
        CARRINHO
      </a>
    </div>

  </header>


  <main class="institutional-page">

    <div class="institutional-inner">

      <h1 class="institutional-title">
        ATENDIMENTO
      </h1>

      <section class="institutional-block">

        <h2>
          HORÁRIO
        </h2>

        <p>
          SEGUNDA A SEXTA-FEIRA — 9H ÀS 17H
        </p>

        <p>
          SÁBADO — 9H ÀS 12H
        </p>

      </section>

      <section class="institutional-block">

        <h2>
          WHATSAPP
        </h2>

        <a
          href="https://wa.me/5581989436655"
          target="_blank"
          rel="noopener noreferrer"
        >
          +55 (81) 98943-6655
        </a>

      </section>

      <section class="institutional-block">

        <h2>
          E-MAIL
        </h2>

        <a href="mailto:contato@ojobosco.com">
          contato@ojobosco.com
        </a>

      </section>

    </div>

  </main>

  <script src="script.js"></script>

</body>

</html>
