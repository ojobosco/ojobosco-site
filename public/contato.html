<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Contato e atendimento OJOBOSCO"
  >

  <title>Contato — OJOBOSCO</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    :root {
      --page-font:
        "Copperplate",
        "Copperplate Gothic Light",
        "Copperplate Gothic",
        serif;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: var(--page-font);
    }

    .institutional-page {
      min-height: 100vh;
      padding: 150px 6vw 120px;
    }

    .institutional-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .institutional-title {
      margin: 0 0 65px;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .institutional-block {
      padding: 32px 0;
      border-top: 1px solid #d6d6d6;
    }

    .institutional-block:last-child {
      border-bottom: 1px solid #d6d6d6;
    }

    .institutional-block h2 {
      margin: 0 0 18px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .institutional-block p,
    .institutional-block a {
      margin: 0 0 8px;
      color: #111111;
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: 0.03em;
      text-decoration: none;
    }

    .institutional-block a {
      border-bottom: 1px solid #111111;
    }

    @media (max-width: 700px) {

      .institutional-page {
        padding: 110px 22px 80px;
      }

      .institutional-title {
        margin-bottom: 45px;
        font-size: 21px;
      }

      .institutional-block p,
      .institutional-block a {
        font-size: 11px;
      }

    }

  </style>

</head>


<body>

  <main class="institutional-page">

    <div class="institutional-inner">

      <h1 class="institutional-title">
        ATENDIMENTO
      </h1>


      <section class="institutional-block">

        <h2>
          HORÁRIO
        </h2>

        <p>
          SEGUNDA A SEXTA-FEIRA — 9H ÀS 17H
        </p>

        <p>
          SÁBADO — 9H ÀS 12H
        </p>

      </section>


      <section class="institutional-block">

        <h2>
          WHATSAPP
        </h2>

        <a
          href="https://wa.me/5581989436655"
          target="_blank"
          rel="noopener noreferrer"
        >
          +55 (81) 98943-6655
        </a>

      </section>


      <section class="institutional-block">

        <h2>
          E-MAIL
        </h2>

        <a href="mailto:contato@ojobosco.com">
          contato@ojobosco.com
        </a>

      </section>

    </div>

  </main>

</body>

</html>
