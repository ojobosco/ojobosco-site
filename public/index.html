<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>OJOBOSCO</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- ======================================================
       FAIXA SUPERIOR
  ======================================================= -->

  <div class="announcement-bar">
    GANHE FRETE GRÁTIS EM COMPRAS ACIMA DE R$500
  </div>


  <!-- ======================================================
       HEADER
  ======================================================= -->

  <header class="topbar">

    <button
      type="button"
      class="menu-toggle"
      id="menuButton"
    >
      MENU
    </button>


    <a
      href="/"
      class="brand-top"
    >
      OJOBOSCO
    </a>


    <div class="top-actions">

      <a
        href="/universo"
        class="nav-link"
      >
        UNIVERSO
      </a>


      <a
        href="/loja"
        class="nav-link"
      >
        LOJA
      </a>


      <a
        href="/sobre"
        class="nav-link"
      >
        SOBRE
      </a>


      <a
        href="/carrinho"
        id="cartButton"
        class="cart-link"
      >
        CARRINHO
        <span
          id="cartCount"
          class="cart-count"
        ></span>
      </a>

    </div>

  </header>


  <!-- ======================================================
       MENU
  ======================================================= -->

  <div
    class="side-menu"
    id="menuOverlay"
  >

    <button
      type="button"
      class="close-menu"
      id="closeMenu"
    >
      FECHAR
    </button>


    <div class="side-menu-inner">

      <a href="/universo">
        UNIVERSO
      </a>

      <a href="/loja">
        LOJA
      </a>

      <a href="/sobre">
        SOBRE
      </a>

      <a href="/contato">
        CONTATO
      </a>

    </div>

  </div>


  <!-- ======================================================
       HOME
  ======================================================= -->

  <main>


    <!-- ====================================================
         PRODUTOS
         PERFUME E REFIL FORA DE VISUALIZAÇÃO
    ===================================================== -->

    <section class="collection">

      <div class="products-grid">


        <!-- ===============================================
             AROMATIZADOR
        ================================================ -->

        <article class="product-card">

          <a
            href="/loja#aromatizadores"
            class="product-card-link"
          >

            <div class="product-image">

              <img
                src="https://images.squarespace-cdn.com/content/v1/67e2805aa763631aad8707db/a5d5d6a6-143e-4a4a-8e21-1fe416fa18d7/Photoroom_20260624_074234.jpg"
                alt="Aromatizador OJOBOSCO"
                loading="eager"
              >

            </div>


            <div class="product-info">

              <h2>
                AROMATIZADOR
              </h2>


              <p class="product-price">
                A PARTIR DE R$179
              </p>

            </div>

          </a>

        </article>


        <!-- ===============================================
             DIFUSOR
        ================================================ -->

        <article class="product-card">

          <a
            href="/loja#difusores"
            class="product-card-link"
          >

            <div class="product-image">

              <img
                src="https://images.squarespace-cdn.com/content/v1/67e2805aa763631aad8707db/881cc1be-2c0d-4396-bb85-6a3c0459ddc0/Photoroom_20260624_083912.jpg"
                alt="Difusor OJOBOSCO"
                loading="eager"
              >

            </div>


            <div class="product-info">

              <h2>
                DIFUSOR
              </h2>


              <p class="product-price">
                A PARTIR DE R$189
              </p>

            </div>

          </a>

        </article>


        <!-- ===============================================
             VELA
        ================================================ -->

        <article class="product-card">

          <a
            href="/loja#velas"
            class="product-card-link"
          >

            <div class="product-image">

              <img
                src="/vela-produto.jpg"
                alt="Vela OJOBOSCO"
                loading="eager"
              >

            </div>


            <div class="product-info">

              <h2>
                VELA
              </h2>


              <p class="product-price">
                R$289
              </p>

            </div>

          </a>

        </article>


        <!-- ===============================================
             BIBLIOTECA OLFATIVA
        ================================================ -->

        <article class="product-card">

          <a
            href="/loja#biblioteca-olfativa"
            class="product-card-link"
          >

            <div class="product-image">

              <img
                src="/biblioteca-still.jpg"
                alt="Biblioteca Olfativa OJOBOSCO"
                loading="eager"
              >

            </div>


            <div class="product-info">

              <h2>
                BIBLIOTECA OLFATIVA
              </h2>


              <p class="product-price">
                R$239
              </p>

            </div>

          </a>

        </article>


      </div>

    </section>


  </main>


  <!-- ======================================================
       SCRIPT PRINCIPAL
  ======================================================= -->

  <script src="script.js"></script>


  <!-- ======================================================
       MENU
  ======================================================= -->

  <script>
  (function () {
    "use strict";


    const menuButton =
      document.getElementById(
        "menuButton"
      );


    const menu =
      document.getElementById(
        "menuOverlay"
      );


    const closeMenu =
      document.getElementById(
        "closeMenu"
      );


    function abrirMenu() {

      if (!menu) {
        return;
      }


      menu.classList.add(
        "active"
      );


      menu.classList.add(
        "open"
      );


      document.body.classList.add(
        "menu-open"
      );

    }


    function fecharMenu() {

      if (!menu) {
        return;
      }


      menu.classList.remove(
        "active"
      );


      menu.classList.remove(
        "open"
      );


      document.body.classList.remove(
        "menu-open"
      );

    }


    if (menuButton) {

      menuButton.addEventListener(
        "click",
        abrirMenu
      );

    }


    if (closeMenu) {

      closeMenu.addEventListener(
        "click",
        fecharMenu
      );

    }


    if (menu) {

      menu
        .querySelectorAll(
          "a"
        )
        .forEach(
          function (link) {

            link.addEventListener(
              "click",
              fecharMenu
            );

          }
        );

    }

  })();
  </script>


</body>

</html>
